<style>
/* ---------- Theme tokens ---------- */
:root {
  --bg: #070b12;
  --bg-alt: #0b111b;
  --surface: #0f1723;
  --surface-2: #152030;
  --border: #1e2a3b;
  --text: #a8b3c6;
  --text-h: #f1f5fb;
  --muted: #74819a;
  --accent: #2ee6c5;
  --accent-2: #3b82f6;
  --accent-soft: rgba(46, 230, 197, 0.12);
  --on-accent: #04261f;
  --pro: #fbbf24;
  --pro-soft: rgba(251, 191, 36, 0.14);
  --danger: #ff4d5e;
  --shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
  --glow: rgba(46, 230, 197, 0.18);
  --nav-bg: rgba(7, 11, 18, 0.72);
  color-scheme: dark;

  --sans: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
  --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --radius: 20px;
  --nav-h: 68px;

  /* z-index scale */
  --z-base: 1;
  --z-float: 10;
  --z-nav: 50;
  --z-skip: 100;
}

[data-theme='light'] {
  --bg: #f5f7fb;
  --bg-alt: #ebf0f7;
  --surface: #ffffff;
  --surface-2: #f1f5fa;
  --border: #dbe2ec;
  --text: #3f4a60;
  --text-h: #0b1220;
  /* light-mode text colours darkened to clear WCAG 4.5:1 on --bg and --surface */
  --muted: #56627a;
  --accent: #0b7d6b;
  --accent-2: #1d4ed8;
  --accent-soft: rgba(11, 125, 107, 0.1);
  --on-accent: #ffffff;
  --pro: #b45309;
  --pro-soft: rgba(217, 119, 6, 0.12);
  --danger: #e11d48;
  --shadow: 0 20px 45px -24px rgba(15, 30, 60, 0.28);
  --glow: rgba(13, 159, 136, 0.14);
  --nav-bg: rgba(245, 247, 251, 0.78);
  color-scheme: light;
}

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 12px);
  -webkit-text-size-adjust: 100%;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation: none !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s, color 0.3s;
  overflow-x: hidden;
}

h1,
h2,
h3 {
  font-family: var(--display);
  color: var(--text-h);
  line-height: 1.12;
  margin: 0;
  letter-spacing: -0.02em;
}

p {
  margin: 0;
}

a {
  color: var(--accent);
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}

.container {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 24px;
}

.container--narrow {
  max-width: 820px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  left: 16px;
  top: -60px;
  z-index: var(--z-skip);
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}

.skip-link:focus {
  top: 12px;
}

.accent-text {
  color: var(--accent);
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- Buttons & badges ---------- */
.play-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 10px 22px 10px 16px;
  border-radius: 14px;
  background: #0b0f17;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 10px 30px -10px var(--glow), 0 0 0 1px rgba(46, 230, 197, 0.08);
  transition: box-shadow 0.3s, border-color 0.3s;
}

.play-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 14px 40px -10px var(--glow), 0 0 0 1px var(--accent);
}

.play-btn__text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
  text-align: left;
}

.play-btn__text small {
  font-size: 10px;
  letter-spacing: 0.08em;
  opacity: 0.8;
}

.play-btn__text strong {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 600;
}

.play-btn--compact {
  min-height: 44px;
  padding: 7px 14px 7px 10px;
  gap: 8px;
  border-radius: 11px;
}

.play-btn__single {
  font-weight: 600;
  font-size: 14px;
}

.ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 14px 22px;
  border-radius: 14px;
  border: 1px solid var(--border);
  color: var(--text-h);
  font-weight: 500;
  transition: border-color 0.2s, background-color 0.2s;
}

.ghost-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-h);
  transition: border-color 0.2s;
}

.icon-btn:hover {
  border-color: var(--accent);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.badge--free {
  background: var(--accent-soft);
  color: var(--accent);
}

.badge--pro {
  background: var(--pro-soft);
  color: var(--pro);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-h);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
}

.rec-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 0 0 var(--danger);
  animation: rec 1.8s infinite;
}

@keyframes rec {
  70% {
    box-shadow: 0 0 0 8px transparent;
  }
  100% {
    box-shadow: 0 0 0 0 transparent;
  }
}

/* ---------- Nav ---------- */
.nav {
  position: fixed;
  inset: 0 0 auto;
  z-index: var(--z-nav);
  border-bottom: 1px solid transparent;
  transition: background-color 0.3s, border-color 0.3s, backdrop-filter 0.3s;
}

.nav--solid {
  background: var(--nav-bg);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom-color: var(--border);
}

.nav__progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transform-origin: 0 50%;
}

.nav__inner {
  display: flex;
  align-items: center;
  gap: 24px;
  height: var(--nav-h);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--text-h);
  font-family: var(--display);
  font-weight: 700;
  font-size: 20px;
}

.nav__links {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.nav__links a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 12px;
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  transition: color 0.2s, background-color 0.2s;
}

.nav__links a:hover {
  color: var(--text-h);
  background: var(--accent-soft);
}

.nav__actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav__menu-btn {
  display: none;
}

.mobile-menu {
  overflow: hidden;
  border-top: 1px solid var(--border);
}

.mobile-menu__inner {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-block: 12px 20px;
}

.mobile-menu__inner a:not(.play-btn) {
  padding: 12px 4px;
  color: var(--text-h);
  font-weight: 500;
  border-bottom: 1px solid var(--border);
}

.mobile-menu__inner .play-btn {
  margin-top: 16px;
  align-self: flex-start;
}

@media (max-width: 920px) {
  .nav__links,
  .nav__cta {
    display: none;
  }
  .nav__actions {
    margin-left: auto;
  }
  .nav__menu-btn {
    display: grid;
  }
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  padding: calc(var(--nav-h) + 72px) 0 96px;
  overflow: hidden;
}

.hero__glow {
  position: absolute;
  inset: -20% -10% auto;
  height: 900px;
  background:
    radial-gradient(600px 400px at 75% 30%, var(--glow), transparent 70%),
    radial-gradient(500px 360px at 15% 10%, rgba(59, 130, 246, 0.12), transparent 70%);
  pointer-events: none;
}

.hero__glow::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 65%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 65%);
  opacity: 0.45;
}

.hero__grid {
  position: relative;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 48px;
  align-items: center;
}

.hero__copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 24px;
}

.hero h1 {
  font-size: clamp(2.5rem, 5.6vw, 4.4rem);
  font-weight: 700;
  letter-spacing: -0.035em;
}

.hero__lede {
  font-size: 1.15rem;
  max-width: 34em;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
}

.trust-strip {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.trust-strip li {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  color: var(--text-h);
  font-size: 13px;
  font-weight: 500;
}

.trust-strip svg {
  color: var(--accent);
}

.hero__visual {
  position: relative;
  display: flex;
  justify-content: center;
}

.phone {
  position: relative;
  width: min(300px, 78vw);
  aspect-ratio: 9 / 18.5;
  padding: 12px;
  border-radius: 46px;
  background: linear-gradient(160deg, #2a3446, #0c121c);
  box-shadow:
    0 40px 90px -30px rgba(0, 0, 0, 0.7),
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 0 80px -20px var(--glow);
}

.phone__notch {
  position: absolute;
  top: 22px;
  left: 50%;
  translate: -50% 0;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #05080d;
  z-index: 2;
}

.phone__screen {
  height: 100%;
  border-radius: 36px;
  background: radial-gradient(circle at 50% 35%, #0e2a2a, #060a10 70%);
  display: flex;
  flex-direction: column;
  padding: 48px 20px 24px;
  color: #dbe6f3;
  overflow: hidden;
}

.phone__top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
}

.phone__top .tag {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(46, 230, 197, 0.15);
  color: #2ee6c5;
}

.radar {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  margin: auto 0;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle, rgba(46, 230, 197, 0.08), transparent 70%);
  border: 1px solid rgba(46, 230, 197, 0.35);
}

.radar__ring {
  position: absolute;
  inset: 0;
  margin: auto;
  border-radius: 50%;
  border: 1px solid rgba(46, 230, 197, 0.2);
}

.radar__ring:nth-child(1) { width: 75%; height: 75%; }
.radar__ring:nth-child(2) { width: 50%; height: 50%; }
.radar__ring:nth-child(3) { width: 25%; height: 25%; }

.radar__cross {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(rgba(46, 230, 197, 0.15), rgba(46, 230, 197, 0.15)) center / 1px 100% no-repeat,
    linear-gradient(rgba(46, 230, 197, 0.15), rgba(46, 230, 197, 0.15)) center / 100% 1px no-repeat;
}

.radar__sweep {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(46, 230, 197, 0.55), rgba(46, 230, 197, 0) 70deg);
}

.radar__core {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #2ee6c5;
  box-shadow: 0 0 16px #2ee6c5;
}

.radar__blip {
  position: absolute;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: #2ee6c5;
  box-shadow: 0 0 14px #2ee6c5;
}

.radar__blip--alert {
  background: #ff4d5e;
  box-shadow: 0 0 18px #ff4d5e;
}

.phone__status {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 64px;
}

.phone__status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 500;
}

.phone__status-row svg {
  color: #2ee6c5;
}

.phone__status-row.is-alert,
.phone__status-row.is-alert svg {
  color: #ff6b78;
}

.bar {
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.bar__fill {
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: 0 50%;
  border-radius: inherit;
  background: linear-gradient(90deg, #2ee6c5, #3b82f6);
}

.float-chip {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-h);
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow);
  white-space: nowrap;
  z-index: var(--z-float);
}

.float-chip svg {
  color: var(--accent);
}

.float-chip--a {
  top: 18%;
  left: -4%;
}

.float-chip--a svg {
  color: var(--danger);
}

.float-chip--b {
  bottom: 14%;
  right: -4%;
}

@media (max-width: 920px) {
  .hero {
    padding-top: calc(var(--nav-h) + 40px);
  }
  .hero__grid {
    grid-template-columns: 1fr;
    text-align: center;
  }
  .hero__copy {
    align-items: center;
  }
  .hero__actions,
  .trust-strip {
    justify-content: center;
  }
  .hero__visual {
    margin-top: 24px;
  }
  .float-chip--a {
    left: 0;
  }
  .float-chip--b {
    right: 0;
  }
}

@media (max-width: 480px) {
  .float-chip {
    font-size: 12px;
    padding: 8px 10px;
  }
}

/* ---------- Sections ---------- */
.section {
  padding: 112px 0;
  position: relative;
}

.section--alt {
  background: var(--bg-alt);
  border-block: 1px solid var(--border);
}

.section-header {
  max-width: 680px;
  margin: 0 auto 56px;
  text-align: center;
}

.eyebrow {
  display: inline-block;
  margin-bottom: 14px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.eyebrow::before {
  content: '// ';
  opacity: 0.6;
}

.section-header h2 {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 700;
}

.lede {
  margin-top: 16px;
  font-size: 1.1rem;
}

@media (max-width: 640px) {
  .section {
    padding: 80px 0;
  }
  .section-header {
    margin-bottom: 40px;
  }
}

/* ---------- Tools ---------- */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

/* Tool cards are informational, not clickable, so they get no hover lift. */
.tool-card {
  position: relative;
  padding: 28px;
  overflow: hidden;
  box-shadow: none;
}

.tool-card::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--accent);
  opacity: 0.7;
}

.tool-card--pro::before {
  background: var(--pro);
}

.tool-card__head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 18px;
}

.tool-card__index {
  display: block;
  margin-bottom: 6px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}

.tool-card__icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent);
}

.tool-card--pro .tool-card__icon {
  background: var(--pro-soft);
  color: var(--pro);
}

.tool-card h3 {
  font-size: 1.3rem;
  margin-bottom: 10px;
}

@media (max-width: 920px) {
  .tools-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .tools-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Scan All ---------- */
.scan-panel {
  max-width: 980px;
  margin: 0 auto;
  padding: 28px;
}

.scan-panel__bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 32px;
}

.segmented {
  position: relative;
  display: inline-flex;
  padding: 5px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}

.segmented__btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: 10px;
  background: none;
  color: var(--text);
  font-weight: 600;
  transition: color 0.2s;
  z-index: var(--z-base);
}

.segmented__btn.is-active {
  color: var(--on-accent);
}

.segmented__pill {
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 10px;
  background: var(--accent);
}

.scan-panel__body {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 40px;
  align-items: start;
}

.scan-panel__copy h3 {
  font-size: 1.8rem;
  margin-bottom: 14px;
}

.scan-panel__count {
  margin-top: 24px;
  color: var(--muted);
}

.scan-panel__count strong {
  font-family: var(--display);
  font-size: 2.4rem;
  color: var(--accent);
  margin-right: 6px;
}

.scan-steps {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scan-steps li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-h);
}

.scan-steps li > svg {
  color: var(--accent);
  flex-shrink: 0;
}

.scan-steps__num {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}

.scan-steps__name {
  font-weight: 500;
  flex: 1;
}

.scan-steps__check {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  flex-shrink: 0;
}

@media (max-width: 760px) {
  .scan-panel {
    padding: 20px;
  }
  .scan-panel__body {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .segmented {
    display: flex;
    width: 100%;
  }
  .segmented__btn {
    flex: 1;
    justify-content: center;
    padding-inline: 10px;
  }
}

/* ---------- Compare ---------- */
.plans {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  max-width: 820px;
  margin: 0 auto 28px;
}

.plan {
  position: relative;
  padding: 30px;
  box-shadow: none;
}

.plan--pro {
  border-color: color-mix(in srgb, var(--pro) 55%, var(--border));
  background:
    radial-gradient(420px 200px at 100% 0%, var(--pro-soft), transparent 70%),
    var(--surface);
  box-shadow: var(--shadow);
}

.plan__flag {
  position: absolute;
  top: 22px;
  right: 22px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--pro);
  color: #1a1204;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

[data-theme='light'] .plan__flag {
  color: #fff;
}

.plan__name {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.plan--pro .plan__name {
  color: var(--pro);
}

.plan__price {
  margin-top: 10px;
  font-family: var(--display);
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text-h);
  line-height: 1.15;
}

.plan__note {
  margin-top: 4px;
  font-size: 14px;
  color: var(--muted);
}

.plan__list {
  list-style: none;
  padding: 22px 0 0;
  margin: 22px 0 0;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.plan__list li {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-h);
  font-size: 15px;
}

.plan__list svg {
  flex-shrink: 0;
  color: var(--accent);
}

.plan--pro .plan__list svg {
  color: var(--pro);
}

@media (max-width: 640px) {
  .plans {
    grid-template-columns: 1fr;
  }
  .plan {
    padding: 24px;
  }
}

.compare {
  max-width: 820px;
  margin: 0 auto;
  overflow: hidden;
}

.table-scroll {
  overflow-x: auto;
}

.compare table {
  width: 100%;
  border-collapse: collapse;
  min-width: 420px;
}

.compare th,
.compare td {
  padding: 16px 24px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.compare thead th {
  font-family: var(--display);
  color: var(--text-h);
  font-size: 1.05rem;
  background: var(--surface-2);
}

.compare th:first-child {
  text-align: left;
}

.compare tbody th {
  font-family: var(--sans);
  font-weight: 500;
  color: var(--text-h);
  font-size: 15px;
}

.compare .col-pro {
  background: color-mix(in srgb, var(--pro) 6%, transparent);
}

.compare thead .col-pro {
  background: color-mix(in srgb, var(--pro) 12%, var(--surface-2));
  color: var(--pro);
}

.mark {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
}

.mark--yes {
  background: var(--accent-soft);
  color: var(--accent);
}

.mark--no {
  background: var(--surface-2);
  color: var(--muted);
}

.mark-note {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-h);
}

.compare__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 24px;
}

@media (max-width: 640px) {
  .compare th,
  .compare td {
    padding: 14px 12px;
  }
  .compare__foot {
    flex-direction: column;
    text-align: center;
  }
}

/* ---------- Privacy ---------- */
.privacy-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.privacy-card {
  padding: 26px;
  box-shadow: none;
}

.privacy-card__icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  margin-bottom: 18px;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--accent);
}

.privacy-card h3 {
  font-size: 1.15rem;
  margin-bottom: 8px;
}

.privacy-card p {
  font-size: 15px;
}

.privacy-policy {
  display: flex;
  justify-content: center;
  margin-top: 36px;
}

@media (max-width: 1000px) {
  .privacy-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 560px) {
  .privacy-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- FAQ ---------- */
.faq-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.faq-item {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  transition: border-color 0.3s;
}

.faq-item.is-open {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
}

.faq-item h3 {
  font-size: inherit;
  letter-spacing: normal;
}

.faq-item__q {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px;
  border: 0;
  background: none;
  text-align: left;
  font-family: var(--display);
  font-size: 1.08rem;
  font-weight: 600;
  color: var(--text-h);
}

.faq-item__icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
}

.faq-item__a {
  overflow: hidden;
}

.faq-item__a p {
  padding: 0 22px 22px;
}

/* ---------- Footer ---------- */
.footer {
  padding: 40px 0 32px;
}

.cta-band {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 40px;
  margin-bottom: 72px;
  background:
    radial-gradient(500px 200px at 0% 0%, var(--glow), transparent 70%),
    var(--surface);
}

.cta-band h2 {
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  margin-bottom: 8px;
}

.footer__grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1.4fr;
  gap: 40px;
  padding-bottom: 40px;
  border-bottom: 1px solid var(--border);
}

.footer__brand p {
  margin-top: 12px;
  color: var(--muted);
}

.footer__col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.footer__col a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
}

.footer__col h3 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 6px;
}

.footer__col a {
  color: var(--text);
  transition: color 0.2s;
}

.footer__col a:hover {
  color: var(--accent);
}

.footer__mail {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  word-break: break-all;
}

.footer__bottom {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px 24px;
  padding-top: 24px;
  font-size: 13px;
  color: var(--muted);
}

@media (max-width: 760px) {
  .cta-band {
    padding: 28px;
    flex-direction: column;
    text-align: center;
  }
  .footer__grid {
    grid-template-columns: 1fr 1fr;
  }
  .footer__brand {
    grid-column: 1 / -1;
  }
}

@media (max-width: 480px) {
  .container {
    padding-inline: 18px;
  }
  .footer__grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Review fixes ---------- */
.hero__visual {
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.demo-note {
  margin: 0;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.03em;
  color: var(--muted);
  text-align: center;
}

.tool-card__note {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 12px;

}

.hero__limit {
  margin: 0;
  max-width: 34em;
  font-size: 14px;
  color: var(--muted);
}

/* ---------- Mobile fixes ---------- */
/* Keep visually-hidden table labels inside the scroll area so they can't widen the page. */
.table-scroll {
  position: relative;
}

.sr-only {
  margin: -1px;
  padding: 0;
  border: 0;
}

.scan-steps__num {
  font-size: 12px;
}

/* Small phones */
@media (max-width: 360px) {
  .container {
    padding-inline: 14px;
  }
  .nav__inner {
    gap: 10px;
  }
  .nav__actions {
    gap: 8px;
  }
  .brand {
    font-size: 18px;
    gap: 8px;
  }
}

/* Very narrow, e.g. 200% zoom or the largest text size on a phone */
@media (max-width: 300px) {
  .brand span {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

    overflow-wrap: anywhere;
  }
}

/* Scan All panel: let columns and tabs shrink on narrow screens */
.scan-panel__body > * {
  min-width: 0;
}

.segmented {
  max-width: 100%;
}

.scan-steps__name {
  min-width: 0;
  overflow-wrap: anywhere;
}

@media (max-width: 420px) {
  .scan-panel {
    padding: 20px;
  }
  .segmented {
    display: flex;
    width: 100%;
  }
  .segmented__btn {
    flex: 1 1 0;
    justify-content: center;
    padding: 0 10px;
  }
}

@media (max-width: 300px) {
  .scan-panel {
    padding: 14px;
  }
  .segmented {
    flex-direction: column;
  }
  .scan-steps li {
    gap: 8px;
    padding: 10px;
  }
}

/* Long email addresses wrap instead of widening the page */
.section-header a {
  overflow-wrap: anywhere;
}

/* Plan cards and hero chips at very narrow widths */
.plans > * {
  min-width: 0;
}

@media (max-width: 300px) {
  .plan {
    padding: 20px;
  }
  .plan__price {
    overflow-wrap: anywhere;
  }
  .float-chip {
    white-space: normal;
    max-width: 90%;
  }
}

@media (max-width: 300px) {
  .compare__foot {
    padding: 14px;
  }

    gap: 10px;
    padding: 16px 14px;
    overflow-wrap: anywhere;
  }
  .play-btn {
    padding: 10px 14px 10px 12px;
  }
}

/* Mobile menu: solid panel so page text doesn't show through */
.mobile-menu {
  background: var(--bg);
}

/* Phones: comparison table fits without hiding the Pro column; decorative chips off */
@media (max-width: 480px) {
  .compare table {
    min-width: 0;
  }
  .compare th,
  .compare td {
    padding: 12px 8px;
    font-size: 0.92rem;
  }
  .compare th:first-child {
    padding-left: 14px;
  }
  .mark-note {
    font-size: 12px;
  }
  .float-chip {
    display: none;
  }
}

/* ---------- Free vs Pro cards: clear colour difference ---------- */
.plan__dot {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
}

.plan__dot--empty {
  background: transparent;
  border: 2px solid currentColor;
}

.plan__item--no {
  flex-wrap: wrap;
  color: var(--muted) !important;
}

.pro-only {
  padding: 2px 10px;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* Pro card is inverted: dark in light theme, light in dark theme */
.plan--pro {
  background: var(--text-h);
  border-color: var(--text-h);
  box-shadow: var(--shadow);
}

.plan--pro .plan__name {
  color: color-mix(in srgb, var(--bg) 72%, var(--text-h));
}

.plan--pro .plan__price {
  color: var(--bg);
}

.plan--pro .plan__note {
  color: color-mix(in srgb, var(--bg) 78%, var(--text-h));
}

.plan--pro .plan__list {
  border-top-color: color-mix(in srgb, var(--bg) 22%, var(--text-h));
}

.plan--pro .plan__list li {
  color: var(--bg);
}

.plan--pro .plan__dot {
  background: var(--danger);
}

/* Not-included marks: red cross so the Free gaps are easy to spot */
.mark--no {
  background: color-mix(in srgb, var(--danger) 14%, transparent);
  color: var(--danger);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 35%, transparent);
}

/* ---------- Support ---------- */
.support-card {
  max-width: 660px;
  margin: 0 auto;
  padding: 44px 40px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.support-card h2 {
  font-size: clamp(1.7rem, 3.4vw, 2.4rem);
  font-weight: 700;
}

.support-card__lede {
  max-width: 34em;
  margin: 14px 0 0;
  color: var(--text);
}

.support-card__email {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 24px;
  padding: 10px 10px 10px 16px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--text-h);
  font-family: var(--mono);
  font-size: 15px;
  max-width: 100%;
}

.support-card__email > svg {

}

.support-card__email > span {

}

.copy-btn {

  font-size: 14px;

.copy-btn:hover {

}

.support-card__status {

}

.support-card__actions {
  display: flex;

  justify-content: center;
  gap: 12px;
  margin-top: 10px;
}

.solid-btn {
  display: inline-flex;

  gap: 10px;
  min-height: 44px;

}

.solid-btn:hover {

}

.support-card__note {
  max-width: 36em;
  margin: 22px 0 0;
  font-size: 13px;
  color: var(--muted);
}

@media (max-width: 480px) {

/* ---------- Closing CTA: inverted box (dark in light theme, light in dark theme) ---------- */
.cta-band {
  padding: 64px 60px;

.cta-band .play-btn {

/* ---------- Footer: support line + links (section links live in the header) ---------- */
.footer__row {

.copy-email__text {

.footer__links {

.footer__links a {

@media (max-width: 640px) {

/* ---------- Bigger brand + colourful header buttons ---------- */
:root {

  }
  .footer__legal {
    grid-template-columns: 1fr;
    text-align: center;
  }
  .footer__name {
    font-size: 26px;
  }
}

@media (max-width: 300px) {
  .footer__brand {
    gap: 10px;
  }
  .footer__brand .brand__logo {
    width: 40px;
    height: 40px;
  }
  .footer__name {
    font-size: 22px;
  }
}

/* ---------- Free vs Pro heading ---------- */
.section-header--plans .eyebrow::before {
  content: none;
}

.section-header--plans .eyebrow {
  letter-spacing: 0.16em;
}

.plans-title__line {
  display: block;
}

.plans-title__pro {
  color: #c94a40;
}

:root:not([data-theme='light']) .plans-title__pro {
  color: #ff7a6b;
}

/* ---------- Tools: "pocket inspection kit" ---------- */
.kit-header {
  display: grid;
  grid-template-columns: 1fr minmax(0, 420px);
  align-items: end;
  gap: 24px 48px;
  margin-bottom: 32px;
}

.kit-header > * {
  min-width: 0;
}

.kit-header__eyebrow::before {
  content: none;
}

.kit-header__eyebrow {
  letter-spacing: 0.16em;
}

.kit-header h2 {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 700;
  line-height: 1.05;
}

.kit-header__line {
  display: block;
}

.kit-header__accent {
  color: var(--accent);
}

.kit-header__lede {
  margin: 0;
  font-size: 1rem;
  color: var(--text);
}

/* Card tints. Dark theme values first (the default), light theme below. */
.kit-card { --k-bg: #17402b; --k-border: #22573b; }
.kit-card--peach { --k-bg: #3d2a1c; --k-border: #563a26; }
.kit-card--lavender { --k-bg: #2b2546; --k-border: #3d3563; }
.kit-card--blue { --k-bg: #1c2f4f; --k-border: #29426b; }
.kit-card--pink { --k-bg: #3a2028; --k-border: #552e3a; }
.kit-card--yellow { --k-bg: #33331c; --k-border: #4a4a28; }

[data-theme='light'] .kit-card { --k-bg: #e7f6ec; --k-border: #cdebd8; }
[data-theme='light'] .kit-card--peach { --k-bg: #fdeedd; --k-border: #f6dabd; }
[data-theme='light'] .kit-card--lavender { --k-bg: #efeafd; --k-border: #dcd2f8; }
[data-theme='light'] .kit-card--blue { --k-bg: #e8f0fd; --k-border: #d0def8; }
[data-theme='light'] .kit-card--pink { --k-bg: #fde8e8; --k-border: #f5cfcf; }
[data-theme='light'] .kit-card--yellow { --k-bg: #fbf6dc; --k-border: #e8dc9f; }

.kit-card {
  --k-title: #f8fafc;
  --k-text: #d4dbe6;
  --k-soft: #b3bdcc;
  --k-line: rgba(255, 255, 255, 0.14);
  --k-icon-bg: rgba(255, 255, 255, 0.16);
  --k-icon: #f1f5fb;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 24px;
  border-radius: 20px;
  border: 1px solid var(--k-border);
  background: var(--k-bg);
  transition: transform 0.2s, box-shadow 0.2s;
}

[data-theme='light'] .kit-card {
  --k-title: #0f172a;
  --k-text: #334155;
  --k-soft: #475569;
  --k-line: rgba(15, 23, 42, 0.12);
  --k-icon-bg: #ffffff;
  --k-icon: #0f172a;
}

.kit-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}

.kit-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 22px;
}

.kit-card__icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--k-icon-bg);
  color: var(--k-icon);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
}

.kit-badge {
  padding: 3px 10px;
  border-radius: 6px;
  border: 1px solid;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.kit-badge--free {
  border-color: #86efac;
  background: #ecfdf3;
  color: #166534;
}

.kit-badge--pro {
  border-color: #fda4af;
  background: #fff1f2;
  color: #be123c;
}

.kit-card__kicker {
  margin: 0 0 6px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--k-soft);
}

.kit-card h3 {
  margin: 0 0 8px;
  font-size: 1.35rem;
  color: var(--k-title);
}

.kit-card__body {
  margin: 0;
  font-size: 15px;
  line-height: 1.6;
  color: var(--k-text);
}

.kit-card__know {
  margin-top: auto;
  padding-top: 20px;
}

.kit-card__toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 44px;
  padding: 10px 0;
  border: 0;
  border-top: 1px solid var(--k-line);
  border-radius: 0;
  background: none;
  color: var(--k-title);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.kit-card__x {
  display: grid;
  place-items: center;
  transition: transform 0.2s;
}

.kit-card__x.is-open {
  transform: rotate(45deg);
}

.kit-card__note {
  margin: 4px 0 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--k-text);
}

.kit-footnote {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 28px 0 0;
  font-size: 14px;
  color: var(--muted);
  text-align: center;
}

.kit-footnote svg {
  flex-shrink: 0;
  color: var(--muted);
}

@media (max-width: 760px) {
  .kit-header {
    grid-template-columns: 1fr;
    gap: 12px;
  }
}

@media (max-width: 640px) {
  .kit-card {
    padding: 20px;
  }
  .kit-footnote {
    align-items: flex-start;
    text-align: left;
  }
}

@media (max-width: 300px) {
  .kit-card {
    padding: 14px;
  }
  .kit-card h3 {
    font-size: 1.1rem;
    overflow-wrap: anywhere;
  }
  .kit-card__toggle {
    gap: 8px;
  }
}

/* Line up "What to know" across each row of cards (same as the reference layout) */
@supports (grid-template-rows: subgrid) {
  .kit-card {
    display: grid;
    grid-row: span 5;
    grid-template-rows: subgrid;
    row-gap: 0;
  }
  .kit-card__know {
    margin-top: 0;
  }
}

/* Header spacing: logo left, section links centred, actions right */
@media (min-width: 1061px) {
  .nav__inner {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 24px;
  }
  .nav .brand {
    justify-self: start;
  }
  .nav__links {
    justify-self: center;
    margin-left: 0;
    gap: 10px;
  }
  .nav__actions {
    justify-self: end;
    margin-left: 0;
    gap: 14px;
  }
}

/* Hero phone: real app screenshot */
.phone__screen--shot {
  display: grid;
  place-items: center;
  padding: 0;
  background: #05060a;
}

.phone__shot {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Phone frame sized to the screenshot, so the app screen fills it without black bars */
.phone.phone--shot {
  aspect-ratio: auto;
  height: auto;
  padding: 10px;
  border-radius: 34px;
}

.phone--shot .phone__screen--shot {
  height: auto;
  padding: 6px;
  border-radius: 26px;
  background: #05060a;
  overflow: hidden;
}

.phone--shot .phone__shot {
  width: 100%;
  height: auto;
  border-radius: 14px;
  object-fit: initial;
}

/* Dark phone frame; the app screenshot fills the screen edge to edge */
.phone--shot .phone__screen--shot {
  padding: 0;
  border-radius: 26px;
  background: #000;
}

.phone--shot .phone__shot {
  border-radius: 26px;
}

/* =====================================================================
   Motion layer: gentle, looping CSS animations.
   All of it switches off under "reduce motion" (see the rule near the top).
   ===================================================================== */

/* Hero background slowly drifts */
@keyframes glowDrift {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-2%, 3%, 0) scale(1.05); }
}

.hero__glow {
  animation: glowDrift 16s ease-in-out infinite;
}

/* Headline accent: soft light sweep across the green words */
@keyframes accentSweep {
  0% { background-position: 120% 0; }
  100% { background-position: -20% 0; }
}

.hero h1 .accent-text {
  background: linear-gradient(
    100deg,
    var(--accent) 0%,
    var(--accent) 40%,
    color-mix(in srgb, var(--accent) 45%, #ffffff) 50%,
    var(--accent) 60%,
    var(--accent) 100%
  );
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: accentSweep 6s ease-in-out 1.2s infinite;
}

/* Phone floats; two rings orbit behind it; small sparkles twinkle */
.hero__visual {
  isolation: isolate;
}

@keyframes phoneFloat {
  0%, 100% { transform: translateY(0) rotate(-1.2deg); }
  50% { transform: translateY(-14px) rotate(1.2deg); }
}

.hero__visual .phone {
  animation: phoneFloat 7s ease-in-out infinite;
  will-change: transform;
}

@keyframes orbitSpin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

.hero__orbit {
  position: absolute;
  top: 46%;
  left: 50%;
  z-index: -1;
  width: min(460px, 120%);
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px dashed color-mix(in srgb, var(--accent) 40%, transparent);
  transform: translate(-50%, -50%);
  animation: orbitSpin 60s linear infinite;
  pointer-events: none;
}

.hero__orbit::after {
  content: '';
  position: absolute;
  top: 8%;
  left: 18%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px 4px var(--glow);
}

.hero__orbit--inner {
  width: min(360px, 95%);
  border-style: solid;
  border-color: color-mix(in srgb, #f5b83d 30%, transparent);
  animation-duration: 40s;
  animation-direction: reverse;
}

.hero__orbit--inner::after {
  top: auto;
  bottom: 12%;
  left: auto;
  right: 10%;
  width: 8px;
  height: 8px;
  background: #f5b83d;
  box-shadow: 0 0 12px 3px rgba(245, 184, 61, 0.45);
}

@keyframes twinkle {
  0%, 100% { opacity: 0.25; transform: scale(0.6) rotate(0deg); }
  50% { opacity: 1; transform: scale(1) rotate(45deg); }
}

.hero__spark {
  position: absolute;
  z-index: 1;
  width: 18px;
  height: 18px;
  background: #f5b83d;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  animation: twinkle 3.2s ease-in-out infinite;
  pointer-events: none;
}

.hero__spark--1 { top: 8%; right: 8%; }
.hero__spark--2 { top: 58%; left: 4%; width: 12px; height: 12px; background: var(--accent); animation-delay: 1.1s; }
.hero__spark--3 { bottom: 14%; right: 4%; width: 14px; height: 14px; background: #ff7a6b; animation-delay: 2.2s; }

/* Light sweep across the Google Play buttons every few seconds */
@keyframes shine {
  0%, 70% { transform: translateX(-120%) skewX(-20deg); }
  100% { transform: translateX(220%) skewX(-20deg); }
}

.play-btn--shine {
  position: relative;
  overflow: hidden;
}

.play-btn--shine::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
  animation: shine 4.5s ease-in-out infinite;
  pointer-events: none;
}

/* Places strip under the hero */
@keyframes marquee {
  to { transform: translateX(-50%); }
}

.marquee {
  overflow: hidden;
  padding-block: 14px;
  border-block: 1px solid var(--border);
  background: var(--bg-alt);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}

.marquee__track {
  display: flex;
  width: max-content;
  animation: marquee 36s linear infinite;
}

.marquee:hover .marquee__track {
  animation-play-state: paused;
}

.marquee__row {
  display: flex;
  gap: 40px;
  margin: 0;
  padding: 0 20px;
  list-style: none;
}

.marquee__row li {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
}

.marquee__row svg {
  color: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  .marquee__track {
    width: auto;
    flex-wrap: wrap;
    justify-content: center;
  }
  .marquee__row[aria-hidden] {
    display: none;
  }
  .marquee__row {
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 28px;
  }
  .marquee {
    mask-image: none;
    -webkit-mask-image: none;
  }
}

/* Tool cards: icon pops on hover */
.kit-card__icon {
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.kit-card:hover .kit-card__icon {
  transform: translateY(-3px) rotate(-8deg) scale(1.08);
}

/* Pro "Recommended" badge pulses gently */
@keyframes softPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245, 184, 61, 0.55); }
  50% { box-shadow: 0 0 0 8px rgba(245, 184, 61, 0); }
}

.plan__flag {
  animation: softPulse 2.6s ease-out infinite;
}

/* Closing banner: slow light drift */
@keyframes bandDrift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.cta-band {
  background-image:
    linear-gradient(120deg, transparent 30%, rgba(46, 230, 197, 0.12) 50%, transparent 70%);
  background-size: 250% 100%;
  animation: bandDrift 10s ease-in-out infinite;
}

/* Small screens: keep decorations inside the hero */
@media (max-width: 520px) {
  .hero__orbit {
    width: 110%;
  }
  .hero__orbit--inner {
    width: 88%;
  }
}

// Shows the support address with a Copy button. If the clipboard is blocked,
// the address is selected so the visitor can copy it by hand.
function CopyEmail() {
    const [status, setStatus] = useState('');
    const emailRef = useRef(null);
    const selectEmail = () => {
        const range = document.createRange();
        range.selectNodeContents(emailRef.current);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    };
    const copy = () => {
        const done = (msg) => {
            setStatus(msg);
            setTimeout(() => setStatus(''), 2000);
        };
        const fallback = () => {
            selectEmail();
            done('Press Ctrl+C');
        };
        try {
            navigator.clipboard.writeText(SUPPORT_EMAIL).then(() => done('Copied'), fallback);
        }
        catch {
            fallback();
        }
    };
    return (React.createElement(React.Fragment, null,
        React.createElement("span", { className: "copy-email__text", ref: emailRef }, SUPPORT_EMAIL),
        React.createElement("button", { type: "button", className: "copy-btn", onClick: copy, "aria-live": "polite" },
            React.createElement(Icon, { name: status === 'Copied' ? 'check' : 'copy', size: 16 }),
            status || 'Copy')));
}
